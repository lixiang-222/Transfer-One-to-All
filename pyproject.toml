[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transferone"
version = "0.1.0"
description = "Minimal reference implementation of preference-anchored rubric-set learning."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "pyyaml>=6",
    "torch>=2.1",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
transferone-demo = "transferone.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
